# Custom application.properties — Nacos 2.4.3 + openGauss (本地开发)
#
# 与 deploy/1.7.0/config/nacos/custom-application.properties 的差异:
#   - db.url.0 用 host.docker.internal:5432  (替代 opengauss:5432, 本地无 rbnetwork)
#   - 其余保持一致, 业务零改动
#
# 关键点:
#   - spring.datasource.platform=mysql   ← 必须设 mysql, 不能 gaussdb
#     (DatasourceConfiguration.isUseExternalDB() 通过此字段决定走 external 分支)
#   - 实际方言由 SPI 自动选 GaussdbDatabaseDialect (来自 plugins/*.jar)

# spring
server.servlet.contextPath=/nacos
server.contextPath=/nacos
server.port=8848
server.tomcat.accesslog.max-days=30
server.tomcat.accesslog.pattern=%h %l %u %t "%r" %s %b %D %{User-Agent}i %{Request-Source}i
server.tomcat.accesslog.enabled=false
server.error.include-message=ALWAYS
server.tomcat.basedir=file:.

#*************** Datasource (openGauss) ***************#
# 本地用 host.docker.internal:5432 找宿主机上的 opengauss 容器
# (生产环境用 opengauss:5432, 因为同在 rbnetwork)
# 如 host.docker.internal 不可用, 可改成 WSL2 eth0 IP, 如 172.19.230.166
spring.datasource.platform=mysql
spring.sql.init.platform=mysql
db.num=1
db.url.0=jdbc:opengauss://host.docker.internal:5432/nacos_config?tcpKeepAlive=true&reWriteBatchedInserts=true&ApplicationName=nacos_java
db.user.0=nacos
db.password.0=Password@1234
db.pool.config.driverClassName=org.opengauss.Driver
db.pool.config.connectionTimeout=30000
db.pool.config.validationTimeout=10000
db.pool.config.maximumPoolSize=20
db.pool.config.minimumIdle=2

#*************** Auth (disabled, 跟 1.6.2 默认一致, 业务不传 token) ***************#
nacos.core.auth.enabled=false
nacos.core.auth.system.type=nacos
nacos.core.auth.plugin.nacos.token.expire.seconds=18000
nacos.core.auth.plugin.nacos.token.secret.key=Y2hhbmdlLW1lLWluLXByb2R1Y3Rpb24tc2VjcmV0LWtleS0zMi1ieXRlcw==
nacos.core.auth.caching.enabled=true
nacos.core.auth.enable.userAgentAuthWhite=false
nacos.core.auth.server.identity.key=test-identity-key
nacos.core.auth.server.identity.value=test-identity-value-please-change
nacos.security.ignore.urls=/,/error,/**/*.css,/**/*.js,/**/*.html,/**/*.map,/**/*.svg,/**/*.png,/**/*.ico,/console-fe/public/**,/v1/auth/**,/v1/console/health/**,/actuator/**,/v1/console/server/**

#*************** CMDB / metrics / naming ***************#
nacos.cmdb.dumpTaskInterval=3600
nacos.cmdb.eventTaskInterval=10
nacos.cmdb.labelTaskInterval=300
nacos.cmdb.loadDataAtStart=false
management.metrics.export.elastic.enabled=false
management.metrics.export.influx.enabled=false
nacos.naming.distro.taskDispatchThreadCount=10
nacos.naming.distro.taskDispatchPeriod=200
nacos.naming.distro.batchSyncKeyCount=1000
nacos.naming.distro.initDataRatio=0.9
nacos.naming.distro.syncRetryDelay=5000
nacos.naming.data.warmup=true
nacos.console.ui.enabled=true
nacos.core.param.check.enabled=true
